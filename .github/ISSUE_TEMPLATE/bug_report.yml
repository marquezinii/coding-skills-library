---
name: Bug Report
description: Report a bug in a skill or repository tooling
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: What is affected?
      options:
        - A specific skill (name in next field)
        - Repository tooling (skillctl.py, validation, CI)
        - Generated files (catalog.json, SKILLS.md)
        - Documentation (README, CONTRIBUTING, etc.)
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill Name
      description: If a specific skill, which one? (e.g., "ponytail", "security-audit")
      placeholder: skill-name
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
      placeholder: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the issue
      placeholder: |
        1. Install skill X
        2. Run command Y
        3. Observe error Z
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Agent, OS, versions
      placeholder: |
        Agent: Claude Code / Codex / OpenCode / Manus
        OS: macOS / Linux / Windows
        Skill version/commit:
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first
          required: true
        - label: This is not a security issue (use SECURITY.md for those)
          required: true