name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Count skills
        id: count
        run: |
          SKILL_DIRS=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)
          SKILL_MD=$(find skills -name "SKILL.md" -type f | wc -l)
          TOTAL_FILES=$(find skills -type f | wc -l)
          echo "skill_dirs=$SKILL_DIRS" >> $GITHUB_OUTPUT
          echo "skill_md=$SKILL_MD" >> $GITHUB_OUTPUT
          echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT
          echo "Skill directories: $SKILL_DIRS"
          echo "SKILL.md files: $SKILL_MD"
          echo "Total files: $TOTAL_FILES"

      - name: Validate skill structure
        run: |
          python scripts/validate.py

      - name: Check for nested .git directories
        run: |
          if find skills -name ".git" -type d | grep -q .; then
            echo "ERROR: Nested .git directories found:"
            find skills -name ".git" -type d
            exit 1
          fi
          echo "OK: No nested .git directories"

      - name: Check for binary/large files
        run: |
          # Flag files > 1MB that aren't in known asset directories
          find skills -type f -size +1M | while read f; do
            if [[ ! "$f" =~ assets/ ]] && [[ ! "$f" =~ \.tm7$ ]]; then
              echo "WARNING: Large file: $f ($(stat -c%s "$f") bytes)"
            fi
          done

      - name: Secret scan
        run: |
          python scripts/secret_scan.py

      - name: Validate catalog freshness
        run: |
          python scripts/validate_catalog.py

      - name: Summary
        if: always()
        run: |
          echo "## Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Skill directories: ${{ steps.count.outputs.skill_dirs }}" >> $GITHUB_STEP_SUMMARY
          echo "- SKILL.md files: ${{ steps.count.outputs.skill_md }}" >> $GITHUB_STEP_SUMMARY
          echo "- Total files: ${{ steps.count.outputs.total_files }}" >> $GITHUB_STEP_SUMMARY

  test-scripts:
    name: Test Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check skillctl.py
        run: |
          python -m py_compile scripts/skillctl.py

      - name: Syntax check validate.py
        run: |
          python -m py_compile scripts/validate.py

      - name: Syntax check secret_scan.py
        run: |
          python -m py_compile scripts/secret_scan.py

      - name: Syntax check validate_catalog.py
        run: |
          python -m py_compile scripts/validate_catalog.py

      - name: Run skillctl.py --help
        run: |
          python scripts/skillctl.py --help

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          config: .markdownlint.json
          globs: |
            **/*.md
            !skills/**/references/**/*.md
            !SKILLS.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true